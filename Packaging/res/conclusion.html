<h2>Installed</h2>
<p>Restart Logic Pro (or your DAW). Add Vocalise-Rider to an audio track:</p>
<p><b>Audio FX &gt; Audio Units &gt; Daemonj Multimedia &gt; Vocalise-Rider</b></p>
<p>If your DAW doesn't list it, open the Documents folder at
<code>/Users/Shared/Daemonj Multimedia/Vocalise-Rider/Documents</code> and read INSTALL.txt.</p>
</body></html>
